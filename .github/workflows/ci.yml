name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AionDpsMeter.slnx

      - name: Tests
        run: dotnet test --solution AionDpsMeter.slnx --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Companion schedule and data tests
        run: node --test tests/companion.test.mjs

      - name: Build
        run: dotnet build AionDpsMeter.slnx --no-restore
